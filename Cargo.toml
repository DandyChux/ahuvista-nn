[package]
name = "ahuvista-nn"
version = "0.1.0"
edition = "2021"
description = "A multi-modal neural network focused on maternal health predictions"
authors = ["Chukwuma Okoroji <dandychux@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandychux/ahuvista-nn"
documentation = "https://docs.rs/ahuvista-nn"
readme = "README.md"
keywords = ["neural-network", "machine-learning", "healthcare", "multimodal"]
categories = ["science", "algorithms", "healthcare-ml"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = "2.0.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.35", features = ["derive"] }
csv = "1.3.1"
image = "0.25.6"
ndarray = "0.15.6"
rand = "0.9.2"
rand_distr = "0.5.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }

# Define multiple binaries
[[bin]]
name = "ahuvista-train" # Training binary
path = "src/main.rs"

[[bin]]
name = "ahuvista-predict" # Inference binary
path = "src/predict.rs"
