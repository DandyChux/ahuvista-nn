[package]
name = "ahuvista-nn"
version = "0.1.0"
edition = "2021"
description = "A multi-modal neural network focused on maternal health predictions"
authors = ["Chukwuma Okoroji <dandychux@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandychux/rusty-nn"
documentation = "https://docs.rs/ahuvista-nn"
readme = "README.md"
keywords = ["neural-network", "machine-learning", "healthcare", "multimodal"]
categories = ["science", "algorithms", "healthcare-ml"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
csv = "1.3.1"
image = "0.25.6"
ndarray = "0.15.6"
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
