[package]
name = "ahuvista-nn"
version = "1.0.0"
edition = "2024"
autobins = false
description = "A multi-modal neural network focused on maternal health predictions"
authors = ["Chukwuma Okoroji <dandychux@gmail.com>"]
license = "Non-Commercial"
repository = "https://github.com/dandychux/ahuvista-nn"
documentation = "https://docs.rs/ahuvista-nn"
readme = "README.md"
keywords = ["neural-network", "machine-learning", "healthcare", "multimodal"]
categories = ["science", "algorithms"]
exclude = [".DS_Store", "**/.DS_Store"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ahuvista_nn"
path = "src/lib.rs"

[[bin]]
name = "ahuvista"
path = "src/bin/ahuvista.rs"
required-features = ["predict"]

[features]
default = ["prepare", "train", "predict"]

predict = []
prepare = []
train = []

serve = ["dep:axum"]

[dependencies]
axum = { version = "0.8.8", optional = true }
base64 = "0.22.1"
bincode = "2.0.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.35", features = ["derive"] }
csv = "1.3.1"
image = "0.25.6"
ndarray = { version = "0.15.6", features = ["serde"] }
ndarray-npy = "0.10.0"
oauth2 = "5.0.0"
parquet = "57.1.0"
polars = { version = "0.52.0", features = ["csv"] }
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
refinery = { version = "0.9.2", features = ["rusqlite"] }
regex = "1.13.1"
reqwest = { version = "0.13.1", features = ["json", "blocking"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
